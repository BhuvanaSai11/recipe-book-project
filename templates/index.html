<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My International & Indian Recipe Book</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 30px; text-align: center; color: #333; margin: 0; }
        h1 { color: #2c3e50; margin-bottom: 20px; }
        .search-container { margin-bottom: 30px; }
        input[type="text"] { padding: 12px; width: 300px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; outline: none; }
        button { padding: 12px 20px; background-color: #28a745; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; margin-left: 8px; }
        button:hover { background-color: #218838; }
        .recipe-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; max-width: 1200px; margin: 0 auto; text-align: left; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); display: flex; flex-direction: column; }
        .card img { width: 100%; height: 200px; object-fit: cover; border-radius: 6px; }
        .card h3 { font-size: 18px; margin: 15px 0 10px; color: #2c3e50; }
        .section-title { font-size: 13px; font-weight: bold; margin: 12px 0 4px; color: #e67e22; text-transform: uppercase; letter-spacing: 0.5px; }
        ul, ol { padding-left: 18px; margin: 0; font-size: 14px; color: #444; line-height: 1.4; }
        li { margin-bottom: 4px; }
    </style>
</head>
<body>

    <h1>My International & Indian Recipe Book</h1>
    <div class="search-container">
        <form method="POST">
            <input type="text" name="ingredient" placeholder="Search (e.g. dosa, pasta, pizza)..." value="{{ search_query }}" required>
            <button type="submit">Search</button>
        </form>
    </div>

    <div class="recipe-grid">
        {% for recipe in recipes %}
            <div class="card">
                <img src="{{ recipe.image }}" alt="{{ recipe.title }}">
                <h3>{{ recipe.title }}</h3>
                
                <div class="section-title">Ingredients:</div>
                <ul>
                    {% for ing in recipe.ingredients %}
                        <li>{{ ing }}</li>
                    {% endfor %}
                </ul>

                <div class="section-title">Procedure:</div>
                <ol>
                    {% for step in recipe.steps %}
                        <li>{{ step }}</li>
                    {% endfor %}
                </ol>
            </div>
        {% endfor %}
    </div>

</body>
</html>
