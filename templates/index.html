<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Book</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; text-align: center; color: #333; }
        .search-container { margin-bottom: 20px; }
        input[type="text"] { padding: 10px; width: 250px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 15px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #218838; }
        .recipe-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { background: white; padding: 10px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-decoration: none; color: inherit; display: block; }
        .card img { width: 100%; border-radius: 6px; }
        .card h3 { font-size: 16px; margin: 10px 0 0; }
    </style>
</head>
<body>

    <h1>Find a Recipe</h1>
    <div class="search-container">
        <form method="POST">
            <input type="text" name="ingredient" placeholder="Enter main ingredient (e.g. chicken)" value="{{ search_query }}" required>
            <button type="submit">Search</button>
        </form>
    </div>

    <div class="recipe-grid">
        {% for recipe in recipes %}
           <div class="card">
    <img src="{{ recipe.image }}" alt="{{ recipe.title }}">
    <h3>{{ recipe.title }}</h3>
</div>
        {% else %}
            {% if search_query %}
                <p>No recipes found for "{{ search_query }}". Try another ingredient!</p>
            {% endif %}
        {% endfor %}
    </div>

</body>
</html>
