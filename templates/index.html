<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Recipe Book</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 30px; text-align: center; color: #333; margin: 0; }
        h1 { color: #2c3e50; margin-bottom: 20px; }
        .search-container { margin-bottom: 30px; }
        input[type="text"] { padding: 12px; width: 300px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; outline: none; }
        button { padding: 12px 20px; background-color: #28a745; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; margin-left: 8px; }
        button:hover { background-color: #218838; }
        .recipe-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; max-width: 1100px; margin: 0 auto; }
        .card { background: white; padding: 12px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-decoration: none; color: inherit; display: block; transition: transform 0.2s, box-shadow 0.2s; text-align: left; }
        .card:hover { transform: translateY(-4px); box-shadow: 0 6px 12px rgba(0,0,0,0.15); }
        .card img { width: 100%; height: 150px; object-fit: cover; border-radius: 6px; }
        .card h3 { font-size: 15px; margin: 12px 0 4px; color: #333; }
    </style>
</head>
<body>

    <h1>My Personal Recipe Book</h1>
    <div class="search-container">
        <form method="POST">
            <input type="text" name="ingredient" placeholder="Search (e.g. dosa, paneer, chicken)..." value="{{ search_query }}" required>
            <button type="submit">Search</button>
        </form>
    </div>

    <div class="recipe-grid">
        {% for recipe in recipes %}
            <a href="{{ recipe.link }}" target="_blank" class="card">
                <img src="{{ recipe.image }}" alt="{{ recipe.title }}">
                <h3>{{ recipe.title }}</h3>
            </a>
        {% endfor %}
    </div>

</body>
</html>
